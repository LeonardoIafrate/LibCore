<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibCore — Livraria</title>
    <script>
      // aplica o tema antes da renderização para evitar "flash" de tema errado
      try {
        var t = localStorage.getItem('libcore.tema');
        var escuro = t ? t === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
