services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: libcore-db

    environment: 
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer

    ports: 
      - "127.0.0.1:1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: 
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  api: 
    build: 
      context: ./api
      dockerfile: Dockerfile

    container_name: libcore-api

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=libcore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=false"
      Jwt__Chave: "${JWT_CHAVE:?Defina JWT_CHAVE no .env}"
      BootstrapAdmin__Name: ${BOOTSTRAP_ADMIN_NAME:?Defina BOOTSTRAP_ADMIN_NAME no .env}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:?Defina BOOTSTRAP_ADMIN_EMAIL no .env}
      BootstrapAdmin__Cpf: ${BOOTSTRAP_ADMIN_CPF:?Defina BOOTSTRAP_ADMIN_CPF no .env}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?Defina BOOTSTRAP_ADMIN_PASSWORD no .env}

    volumes:
      - uploads_data:/app/wwwroot/uploads

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}

    container_name: libcore-web

    ports:
      - "5173:80"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  sqlserver_data:
  uploads_data: